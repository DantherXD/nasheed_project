name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site reads data.json, which is regenerated from the single
      # source of truth (nasheed-db.json) on every deploy so the two can
      # never drift apart.
      - name: Refresh data.json from nasheed-db.json
        run: |
          cp nasheed-db.json site/data.json
          test -s site/data.json
          test -s site/assets/app.js
          test -s site/index.html
          find site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
