name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site reads data.json, which is rebuilt from the single source of
      # truth (nasheed-db.json) on every deploy so the two can never drift
      # apart. build_site.py also adds the derived fields the browser needs
      # (related records, search keys) and writes the static artist pages —
      # a plain copy of the database would ship without them.
      - name: Build site from nasheed-db.json
        run: |
          python3 tools/build_site.py
          test -s site/data.json
          test -s site/assets/app.js
          test -s site/index.html
          test -f site/sitemap.xml
          find site -type f | wc -l

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
